name: Backend CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  test:
    name: Test & Lint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js for frontend session tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test frontend authentication client
        run: node --test backend/tests/frontend/api.test.cjs

      - name: Install system dependencies (OpenCV & image libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_wardrobe.db
          SYNC_DATABASE_URL: sqlite:///./ci_wardrobe.db
        run: |
          python -m alembic upgrade head

      - name: Run Pytest test suite (Unit & Integration)
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
          SYNC_DATABASE_URL: sqlite:///./ci_test.db
          ENVIRONMENT: test
        run: |
          python -m pytest -v

      - name: Verify Demo Seeder
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci_seed.db
          SYNC_DATABASE_URL: sqlite:///./ci_seed.db
        run: |
          python -m scripts.seed_demo_wardrobe

  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: smart-wardrobe-backend:latest
